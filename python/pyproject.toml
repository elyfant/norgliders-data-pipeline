[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slocum_data_processing"
version = "0.0.1"
description = "Realtime and delayed-mode processing pipeline for Slocum ocean gliders"
requires-python = ">=3.10"
dependencies = [
    "pyglider==0.0.7",
    "dbdreader",
    "gsw",
    "netcdf4",
    "xarray",
    "numpy",
    "scipy",
    "pandas",
    "polars",
    "bitstring",
    "pooch",
    "dask",
    "pyyaml",
    "psycopg2-binary",
]

[project.optional-dependencies]
plots = ["matplotlib", "cmocean"]
notebook = ["matplotlib", "cmocean", "plotly", "folium", "jupyterlab", "ipykernel"]
dev = ["pytest"]

[project.scripts]
slocum-process-mission = "slocum_data_processing.scripts.process_mission:main"

[tool.setuptools.packages.find]
where = ["src"]
